<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="CookWhat – Chatbot AI nấu ăn: nhập nguyên liệu, chụp ảnh tủ lạnh, gợi ý món ăn và tính calo ngay tức thì." />
  <title>CookWhat – AI Nấu Ăn</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=20260613" />
</head>

<body>
  <div class="app-shell">
    <!-- ══ SIDEBAR ══════════════════════════════════════════════ -->
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand-group">
          <div class="brand-logo" aria-hidden="true">🍳</div>
          <div>
            <div class="brand">CookWhat</div>
          </div>
        </div>
        <button class="icon-button sidebar-close-button" id="closeSidebar" aria-label="Đóng sidebar" title="Đóng sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <button class="new-chat-button" id="newChatButton">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Chat mới
      </button>

      <div class="history-header">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>
        </svg>
        Lịch sử
      </div>
      <nav class="session-list" id="sessionList" aria-label="Lịch sử chat"></nav>
    </aside>

    <!-- ══ MAIN CHAT PANEL ═════════════════════════════════════ -->
    <main class="chat-panel">
      <header class="topbar">
        <button class="icon-button" id="openSidebar" aria-label="Mở lịch sử" title="Mở lịch sử">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>

        <div class="topbar-brand">
          <span class="topbar-logo" aria-hidden="true">🍳</span>
          <div class="topbar-title">
            <h1>CookWhat</h1>
            <p>Trợ lý nấu ăn AI — gợi ý món, phân tích ảnh, tính calo</p>
          </div>
        </div>

        <div class="topbar-actions">
          <button class="icon-button" id="themeToggleButton" aria-label="Chuyển dark/light mode" title="Dark / Light mode">
            <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Message area -->
      <section class="messages" id="messages" aria-live="polite"></section>

      <!-- ── Quick Actions ──────────────────────────────────── -->
      <div class="quick-actions" id="quickActions" aria-label="Gợi ý nhanh">
        <button type="button" class="quick-action-btn" id="qa-suggest" data-prompt="Mình có trứng, cà chua, hành lá. Gợi ý món ăn đơn giản giúp mình nhé!">
          🥘 Gợi ý món
        </button>
        <button type="button" class="quick-action-btn" id="qa-image" data-action="upload-image">
          📷 Phân tích ảnh
        </button>
        <button type="button" class="quick-action-btn" id="qa-calorie" data-prompt="Ước lượng calo và dinh dưỡng cho bữa ăn của mình giúp tôi nhé.">
          🔥 Tính calo
        </button>
        <button type="button" class="quick-action-btn" id="qa-menu" data-prompt="Lên thực đơn cho cả tuần giúp mình, ưu tiên món Việt, đủ dinh dưỡng, dễ nấu.">
          📅 Thực đơn tuần
        </button>
      </div>

      <!-- ── Composer ───────────────────────────────────────── -->
      <form class="composer" id="chatForm">
        <!-- Image preview badge (hidden until image is attached) -->
        <div class="image-preview-bar" id="imagePreviewBar" hidden>
          <img id="imagePreviewThumb" src="" alt="" aria-hidden="true" />
          <span id="imagePreviewName" class="image-preview-name"></span>
          <button type="button" id="imageRemoveButton" class="image-remove-btn" aria-label="Xóa ảnh đã chọn" title="Xóa ảnh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <!-- Inner row: textarea + buttons -->
        <div class="composer-inner-row">
          <textarea id="messageInput" rows="1"
            placeholder="Ví dụ: Mình có gà, trứng, hành lá..."
            autocomplete="off"></textarea>
          <div class="composer-actions">
            <!-- Hidden file input for image upload -->
            <input type="file" id="imageFileInput" accept="image/*" hidden />
            <button type="button" id="imageUploadButton" class="image-upload-btn" aria-label="Đính kèm hình ảnh" title="Đính kèm hình ảnh">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </button>
            <button type="button" id="micButton" class="mic-button" aria-label="Nhận dạng giọng nói"
              title="Nhận dạng giọng nói">
              <svg id="micIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z" />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <line x1="12" y1="19" x2="12" y2="22" />
              </svg>
            </button>
            <button type="submit" id="sendButton" aria-label="Gửi tin nhắn">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
              <span>Gửi</span>
            </button>
          </div>
        </div>
        <p class="composer-hint">Nhấn <kbd>Enter</kbd> để gửi · <kbd>Shift+Enter</kbd> để xuống dòng · Kéo thả ảnh vào đây</p>
      </form>
    </main>
  </div>

  <!-- ── Delete confirm modal ──────────────────────────────── -->
  <div class="confirm-modal" id="deleteModal" aria-hidden="true" hidden>
    <div class="confirm-backdrop" data-dismiss="true"></div>
    <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
      <div class="confirm-dialog-icon" aria-hidden="true">🗑️</div>
      <h2 id="deleteModalTitle">Xóa đoạn chat này?</h2>
      <p id="deleteModalDescription">Đoạn chat sẽ bị xóa khỏi danh sách và dữ liệu lưu trữ.</p>
      <div class="confirm-actions">
        <button type="button" class="confirm-button secondary" id="deleteModalCancel">Hủy</button>
        <button type="button" class="confirm-button danger" id="deleteModalConfirm">Xóa</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=20260612-2"></script>
</body>

</html>
